<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demográfico · Demografia 2010 × 2022 · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const d = (v) => `<span class="lk-delta ${v >= 0 ? "lk-up" : "lk-down"}"><i data-lucide="${v >= 0 ? "arrow-up" : "arrow-down"}"></i>${LK.fmt.dec(v, 2).replace(/,?0+$/, "").replace(/,$/, "")}%</span>`;
const box = ([t, a, b, v]) => `<div class="lk-cmpbox"><h3>${t}</h3><div class="lk-cmpbox__grid"><div class="lk-yr"><small>2010</small><b>${a}</b></div><div class="lk-cmpbox__d">${d(v)}</div><div class="lk-yr"><small>2022</small><b>${b}</b></div></div></div>`;
const group = (ic, t, n, items) => `<section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title lk-group-title"><i data-lucide="${ic}"></i>${t}</h2></div><div class="lk-card__body"><div class="lk-cmp-group" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${items.map(box).join("")}</div></div></section>`;
LK.page({ section: "demografico", sub: "2010-2022", updated: "28/09/2026 08:49:44" }, `
  <div class="lk-grid" style="grid-template-columns:34% minmax(0,1fr)">
    <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Mapa dos setores <b>censitários (2022)</b></h2></div><div id="map"></div></section>
    <div class="lk-col">
      ${group("users", "População", 3, [["Moradores", "12.036", "15.995", 37.4], ["Sexo feminino", "6.165", "8.471", 37.4], ["Sexo masculino", "5.871", "7.524", 28.16]])}
      ${group("house", "Domicílios por tipo", 3, [["Casa", "2.413", "2.594", 7.5], ["Apartamento", "1.873", "3.908", 108.65], ["Condomínio", "67", "185", 176.12]])}
    </div>
  </div>
  ${group("users", "Grupos etários", 4, [["Crianças (0 à 14 anos)", "1.924", "2.451", 27.39], ["Jovens (15 à 29 anos)", "3.380", "3.172", -6.15], ["Adultos (30 à 59 anos)", "5.598", "7.746", 38.37], ["Idosos (Acima de 60 anos)", "1.183", "2.621", 121.56]])}
  ${group("house", "Domicílios por moradores", 5, [["Domicílios com 1 morador", "845", "1.822", 121.56], ["Domicílios com 2 moradores", "1.220", "2.295", 88.11], ["Domicílios com 3 moradores", "1.053", "1.516", 43.97], ["Domicílios com 4 moradores", "823", "854", 3.77], ["Com 5 ou mais moradores", "418", "247", -40.91]])}`);
LK.map("#map", { seed: 73, height: 420, slider: true, water: true, sectors: { n: 22, colors: ["--c8"], opacity: 0.38 }, parks: 4 });
LK.icons();
</script>
</body>
</html>
