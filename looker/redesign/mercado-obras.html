<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado · Obras · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const { card } = LK;
// "est: true" = fatia sem rótulo na captura (tamanho lido do gráfico); não mostra percentual
LK.page({ section: "mercado", sub: "obras" }, `
  <div class="lk-bar">${LK.btn("Obras", "mercado-obras.html", true)}<span class="lk-spacer"></span>${LK.dd("Tipologia da ...", 0, true)}<span class="lk-bar__sep"></span>${LK.kpis([["Total de Obras", "114"]])}</div>
  <section class="lk-card" style="align-self:flex-start"><div class="lk-card__body" style="padding:10px 14px">${LK.seg("Filtro espacial:", ["Logradouro", "Raio", "Bairro"], "Raio")}</div></section>
  <div class="lk-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Mapa de <b>obras</b></h2></div><div id="map"></div></section>
    <div class="lk-col">
      ${card({ title: "Status da <b>obra</b>", id: "p-status" })}
      <div class="lk-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        ${card({ title: "Estágio da <b>obra</b>", id: "p-estagio" })}
        ${card({ title: "Tipologia da <b>obra</b>", id: "p-tipo" })}
      </div>
    </div>
    ${card({ title: "Obras por segmento do <b>CNAE</b>", id: "t-cnae", flush: true })}
    ${card({ title: "Área total da <b>obra</b>", id: "p-area" })}
    ${card({ title: "<b>Incorporadores</b>", id: "t-inc", flush: true })}
    ${card({ title: "Ano de início das <b>obras</b>", chip: "Total", id: "c-ano" })}
  </div>`);
LK.map("#map", { seed: 67, height: 470, slider: true, points: { n: 114, spread: 140, colors: ["--c4", "--c2", "--c6", "--c3", "--c5"], weights: [62.5, 25, 10.4, 2.1, 3] } });
LK.pie("#p-status", { donut: true, items: [{ label: "Encerrada", value: 62.5, color: "--c4" }, { label: "Ativa", value: 25, color: "--c2" }, { label: "Nula", value: 10.4, color: "--c6" }, { label: "Paralisada", value: 2.1, color: "--c3", est: true }] });
LK.pie("#p-estagio", { donut: true, small: true, items: [{ label: "Obra Nova", value: 71.5, color: "--c4", est: true }, { label: "Existente", value: 14, color: "--c2", text: "14%" }, { label: "Reforma", value: 10.5, color: "--c3" }, { label: "Acréscimo", value: 2, color: "--c5", est: true }, { label: "Demolição", value: 2, color: "--c6", est: true }] });
LK.pie("#p-tipo", { donut: true, small: true, items: [{ label: "Residencial unifamiliar", value: 51.8, color: "--c4" }, { label: "Comercial salas e lojas", value: 32.5, color: "--c5" }, { label: "Residencial multifamiliar", value: 13.2, color: "--c6" }, { label: "Galpão industrial", value: 2.5, color: "--c3", est: true }] });
LK.pie("#p-area", { donut: true, items: [{ label: "Pequeno porte (< 500 m2)", value: 57, color: "--c4", text: "57%" }, { label: "Médio porte (500 > e < 5000 m2)", value: 38.6, color: "--c2" }, { label: "Grande porte (> 5000 m2)", value: 4.4, color: "--c6" }], minLabel: 0.04 });
LK.table("#t-cnae", { columns: [{ label: "CNAE" }, { label: "Total de obras", align: "c", heat: "green", sort: "desc" }], pager: "1 - 7 / 7", rows: [
  ["Construção de edifícios", 70], ["Obras de alvenaria", 30], ["Outras obras de engenharia civil não especificadas anteriormente", 6], ["Demolição de edifícios e outras estruturas", 3],
  ["Construção de estações e redes de telecomunicações", 2], ["Serviços especializados para construção não especificados anteriormente", 2], ["Construção de estações e redes de distribuição de energia elétrica", 1]] });
LK.table("#t-inc", { columns: [{ label: "Nome incorporador" }, { label: "Total de obras", align: "c", heat: "green", sort: "desc" }], pager: "1 - 10 / 39", rows: [
  ["LITORAL ENGENHARIA E CONSTRUCOES LTDA", 5], ["PROENCA SOLUCOES EM ENGENHARIA LTDA", 3], ["ESCOLA AUTONOMIA LTDA", 3], ["MAXI EMPREENDIMENTOS IMOBILIARIOS LTDA", 3], ["VINCULO CONSTRUCOES LTDA", 2],
  ["ZEITTEC SOLUCOES EM CONECTIVIDADE LTDA", 2], ["B4 ENGENHARIA LTDA", 2], ["ETAPLAN ENGENHARIA & CONSTRUCAO LTDA", 2], ["VAHL COMERCIO DE IMOVEIS LTDA", 1]] });
LK.columns("#c-ano", { height: 280, barMax: 20, valueName: "Total", data: [[2000,1],[2001,0],[2002,0],[2003,0],[2004,0],[2005,1],[2006,1],[2007,0],[2008,4],[2009,1],[2010,2],[2011,2],[2012,0],[2013,1],[2014,9],[2015,1],[2016,1],[2017,3],[2018,9],[2019,9],[2020,6],[2021,12],[2022,14],[2023,7],[2024,12],[2025,12],[2026,6]].map(([a, v]) => [String(a), v]) });
LK.icons();
</script>
</body>
</html>
