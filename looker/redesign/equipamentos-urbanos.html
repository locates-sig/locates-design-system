<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipamentos urbanos · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/bi.css">
</head>
<body>
<main class="bi-main"></main>
<script src="assets/icons.js"></script>
<script src="assets/bi.js"></script>
<script src="assets/mercado.js"></script>
<script>
const { fmt } = LBI;
document.querySelector("main").innerHTML = `
  <div class="bi-toolbar">${LBI.rangeHtml({ label: "Distância do imóvel", min: 0, max: 1000, lo: 0, hi: 1000, unit: " m" })}<span class="bi-toolbar__spacer"></span>
    <div class="summary"><div class="summary__item"><span class="summary__label">Equipamentos no raio</span><span class="summary__value">21</span></div></div></div>
  <div class="grid grid--3">
    <section class="card card--flush span-2">
      <div class="card__head"><div class="card__titles"><h2 class="card__title">Mapa de equipamentos urbanos</h2><p class="card__subtitle">Saúde e educação no raio selecionado</p></div></div>
      <div id="map" style="margin-top:16px;border-radius:0;flex:1"></div>
    </section>
    <section class="card">
      <div class="card__head"><div class="card__titles"><h2 class="card__title">Quantidade por classe</h2><p class="card__subtitle">Equipamentos no raio</p></div></div>
      <div class="grid grid--2" style="gap:12px">
        <div class="kpi"><span class="kpi__label"><i data-lucide="stethoscope"></i>Saúde</span><span class="kpi__value">15</span></div>
        <div class="kpi"><span class="kpi__label"><i data-lucide="school"></i>Escolas</span><span class="kpi__value">6</span></div>
      </div>
      <div id="s-classe"></div>
    </section>
  </div>
  <section class="card card--flush">
    <div class="card__head"><div class="card__titles"><h2 class="card__title">Lista de equipamentos urbanos</h2><p class="card__subtitle">Ordenada por nome</p></div></div>
    <div id="t-eq" style="margin-top:16px"></div>
  </section>`;
LBI.shell({ section: "equipamentos" });
LBI.map("#map", { seed: 107, height: 440, radius: true, slider: true, points: { n: 21, spread: 140, r: 7, colors: ["--cat-1", "--cat-2"], weights: [15, 6] },
  legend: `<ul class="legend"><li><span class="swatch" style="border-radius:50%;background:var(--cat-1)"></span>Saúde</li><li><span class="swatch" style="border-radius:50%;background:var(--cat-2)"></span>Escolas</li></ul>` });
LBI.stackbar("#s-classe", { label: "Participação por classe", items: [{ label: "Saúde", value: 15, color: "--cat-1" }, { label: "Escolas", value: 6, color: "--cat-2", ink: "dark" }], fmt: (v) => fmt.pct((v / 21) * 100) });
LBI.table("#t-eq", { columns: [{ label: "Classe" }, { label: "Nome", sort: "descending" }],
  rows: [["Saúde", "Vinicius Dutra Servicos Medicos"], ["Saúde", "Vignardi Servicos Medicos"], ["Saúde", "Tklf Fisiocor"], ["Saúde", "Mp Servicos Medicos"], ["Saúde", "Joyce Lucia Abreu Pereira Oliveira Psicologia"], ["Saúde", "Jessica Di Vizio Carvalho Psicologia"], ["Escolas", "INST DE ED ESPECIAL PROFº MANOEL BOAVENTURA"], ["Saúde", "Espaco Radiar"]],
  pager: "1–8 de 21" });
LBI.icons();
</script>
</body>
</html>
