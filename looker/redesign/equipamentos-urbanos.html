<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipamentos urbanos · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const icl = (items) => `<ul class="lk-iconlist">${items.map(([ic, l, v]) => `<li><span class="ic"><i data-lucide="${ic}"></i></span><span class="nm">${l}</span><span class="val">${v}</span></li>`).join("")}</ul>`;
const mapCard = (title, legend) => `<section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">${title}</h2>${LK.range("Distância", "0", "1.000")}</div><div id="map"></div><div class="lk-map-legend"><b>Categoria:</b>${legend}</div></section>`;
LK.page({ section: "equipamentos", sub: "equipamentos" }, `
  <div class="lk-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Mapa com <b>equipamentos urbanos</b></h2>${LK.range("Distância", "0", "1.000")}</div><div id="map"></div></section>
    <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Quantidade de <b>equipamentos urbanos</b></h2></div><div class="lk-card__body">
      <div class="lk-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
        <section class="lk-card"><div class="lk-card__body" id="p-eq"></div></section>
        <div class="lk-col"><section class="lk-card">${LK.score("Saúde", "15")}</section><section class="lk-card">${LK.score("Escolas", "6")}</section></div>
      </div>
      <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Lista de <b>equipamentos urbanos</b></h2></div><div id="t-eq"></div></section>
    </div></section>
  </div>`);
LK.map("#map", { seed: 107, height: 480, points: { n: 21, spread: 130, r: 8, colors: ["--c1", "--c2"], weights: [15, 6] }, parks: 4 });
LK.pie("#p-eq", { small: true, items: [{ label: "Saúde", value: 71.4, color: "--c1" }, { label: "Escolas", value: 28.6, color: "--c2" }] });
LK.table("#t-eq", { columns: [{ label: "Classe" }, { label: "Nome", sort: "desc" }], pager: "1 - 21 / 21", rows: [["Saúde", "Vinicius Dutra Servicos Medicos"], ["Saúde", "Vignardi Servicos Medicos"], ["Saúde", "Tklf Fisiocor"], ["Saúde", "Mp Servicos Medicos"], ["Saúde", "Joyce Lucia Abreu Pereira Oliveira Psicologia"], ["Saúde", "Jessica Di Vizio Carvalho Psicologia"], ["Escolas", "INST DE ED ESPECIAL PROFº MANOEL BOAVENTURA"], ["Saúde", "Espaco Radiar"]] });
LK.icons();
</script>
</body>
</html>
