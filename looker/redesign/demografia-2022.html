<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demográfico · Demografia 2022 · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const { card } = LK;
const rows = (items) => `<ul class="lk-rows">${items.map(([ic, l, v]) => `<li><span class="ic"><i data-lucide="${ic}"></i></span><span>${l}</span><span class="v">${v}</span></li>`).join("")}</ul>`;
LK.page({ section: "demografico", sub: "2022" }, `
  <div class="lk-grid" style="grid-template-columns:32% minmax(0,1fr) minmax(0,1fr)">
    <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Mapa dos setores <b>censitários (2022)</b></h2></div><div id="map"></div></section>
    ${card({ title: "População residente total e <b>por sexo setor</b>", body: `<div class="lk-grid" style="grid-template-columns:1.3fr 1fr 1fr;align-items:center"><div class="lk-bignum"><span>População</span><b>15.995</b></div><div class="lk-icons4" style="grid-column:span 2;grid-template-columns:1fr 1fr"><div><i data-lucide="user-round"></i><b>7.524</b></div><div><i data-lucide="user-round"></i><b>8.471</b></div></div></div><div id="p-sexo"></div>` })}
    ${card({ title: "População residente por <b>faixa etária no setor</b>", body: `<div class="lk-icons4"><div><i data-lucide="baby"></i><b>2.451</b></div><div><i data-lucide="user"></i><b>3.172</b></div><div><i data-lucide="user-round"></i><b>7.746</b></div><div><i data-lucide="user-round"></i><b>2.621</b></div></div><div id="p-idade"></div>` })}
    ${card({ title: "Domicílios <b>no setor</b>", body: `<div class="lk-bignum"><span>Domicílios</span><b>6.783</b></div>
      <div class="lk-trio"><div><span>Permanentes</span><b class="lk-val">98,79%</b></div><div><span>Coletivos</span><b class="lk-val">1,21%</b></div><div><span>Improvisados</span><b class="lk-val">0,00%</b></div></div>
      <p class="lk-subtitle">Domicílios pela quantidade de moradores</p>${rows([["user", "Com 1 morador", "27,1%"], ["users", "Com 2 moradores", "34,1%"], ["users", "Com 3 moradores", "22,5%"], ["users", "Com 4 ou mais moradores", "16,3%"]])}
      <p class="lk-subtitle">Banheiros nos domicílios</p>${rows([["toilet", "Residências com 1 banheiro", "30,32%"], ["toilet", "Residências com 2 banheiros", "45,97%"], ["toilet", "Residências com 3 ou mais banheiros", "23,71%"], ["house", "Outros (uso comum e sem banheiro)", "0,00%"]])}` })}
    ${card({ title: "População residente por <b>tipo de domicílio</b>", body: `${rows([["house", "Casa", "38,30%"], ["building", "Condomínio", "2,73%"], ["building-2", "Apartamento", "57,70%"], ["house-plus", "Outros", "1,27%"]])}
      <p class="lk-subtitle">Status das moradias</p>${rows([["house", "Nuclear", "64,09%"], ["house", "Unipessoal", "26,08%"], ["house", "Estendida", "6,89%"], ["house", "Composta", "2,94%"]])}
      <ul class="lk-defs"><li>UNIPESSOAL: Pessoa morando sozinha.</li><li>NUCLEAR: Pais e filhos, sem outros parentes.</li><li>ESTENDIDA: Inclui outros parentes além do núcleo familiar.</li><li>COMPOSTA: Inclui pessoas sem parentesco na residência.</li></ul>` })}
    ${card({ title: "Pirâmide etária <b>da população</b>", id: "pyr" })}
    <div class="lk-col">
      ${card({ title: "População <b>alfabetizada</b>", body: `<div class="lk-bignum"><span>Alfabetizados</span><b>84,58%</b></div>` })}
      ${card({ title: "Composição étnica racial <b>da população</b>", body: rows([["users", "Branca", "85,16%"], ["users", "Índigena ou amarela", "1,01%"], ["users", "Parda", "10,11%"], ["users", "Preta", "3,72%"]]) })}
    </div>
    ${card({ title: "Acesso <b>a água</b>", body: `${rows([["droplets", "Rede geral", "93,95%"], ["droplets", "Poço", "0,16%"], ["droplets", "Outras", "5,89%"]])}
      <p class="lk-subtitle">Destinação do lixo</p>${rows([["trash-2", "Coletado", "96,11%"], ["trash-2", "Depositado", "3,77%"], ["trash-2", "Outras", "0,12%"]])}
      <p class="lk-subtitle">Destinação do esgoto</p>${rows([["waves", "Rede geral", "46,65%"], ["waves", "Fossa séptica", "43,87%"], ["waves", "Outras", "9,47%"]])}` })}
    ${card({ title: "Domicílios <b>com conjugês</b>", body: `${rows([["users", "Casados (sexo diferente)", "55,99%"], ["users", "Casados (mesmo sexo)", "1,02%"], ["user", "Solteiros", "43,00%"]])}
      <p class="lk-subtitle">Pirâmide etária dos conjugês</p><div class="lk-bignum" style="font-size:12.5px;text-align:center">Toda a população casada asados (sexo diferente e mesmo sexo)</div><div id="pyr-conj"></div>` })}
  </div>`);
LK.map("#map", { seed: 71, height: 380, slider: true, sectors: { n: 14, colors: ["--c8"], opacity: 0.38 }, parks: 4 });
LK.pie("#p-sexo", { donut: true, items: [{ label: "Mulheres", value: 53, color: "--c1" }, { label: "Homens", value: 47, color: "--c2" }] });
LK.pie("#p-idade", { donut: true, items: [{ label: "Adultos", value: 48.4, color: "--c6" }, { label: "Jovens", value: 19.8, color: "--c3" }, { label: "Idosos", value: 16.4, color: "--c5" }, { label: "Infância", value: 15.3, color: "--c2" }] });
LK.pyramid("#pyr", { left: { name: "Mulheres", color: "--c1" }, right: { name: "Homens", color: "--c2" }, rows: [["70 mais", 665, 523], ["60-69", 809, 618], ["50-59", 1000, 845], ["30-49", 1470, 1301], ["30-39", 1635, 1488], ["25-29", 702, 611], ["20-24", 581, 497], ["15-19", 377, 397], ["10-14", 411, 384], ["5-9", 440, 433], ["0-4", 362, 411]] });
LK.hbars("#pyr-conj", { valueName: "Pessoas casadas", rows: [["80 mais", 35], ["75-79", 72], ["70-74", 158], ["65-69", 207], ["60-64", 254], ["55-59", 265], ["50-54", 330], ["45-49", 432], ["40-44", 574], ["35-39", 542], ["30-34", 469], ["25-29", 294], ["20-24", 98], ["15-19", 4], ["10-14", 0]] });
LK.icons();
</script>
</body>
</html>
