<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socioeconômico · Socioeconomia 2010 · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const { card, fmt } = LK;
const leg = `<ul class="lk-legend lk-legend--row" style="justify-content:center"><li><i style="background:var(--c4);border-radius:3px"></i>Homens</li><li><i style="background:var(--c6);border-radius:3px"></i>Mulheres</li></ul>`;
LK.page({ section: "socioeconomico", sub: "2010", updated: "28/09/2026 10:40:49" }, `
  <div class="lk-grid" style="grid-template-columns:32% minmax(0,1fr) minmax(0,1fr)">
    <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Mapa dos <b>Setores Censitários</b></h2></div><div id="map"></div></section>
    ${card({ title: "População por classe <b>social do setor</b>", body: `<div class="lk-letters lk-letters--cols"><span><b>A</b>1.059</span><span><b>B</b>2.470</span><span><b>C</b>1.171</span><span><b>D</b>2.573</span><span><b>E</b>743</span></div><div id="p-pop"></div>` })}
    ${card({ title: "População por classe social do setor - <b>Homens X Mulheres</b>", body: `${leg}<div id="g-pop"></div>` })}
    ${card({ title: "População Economicamente <b>Ativa - PEA</b>", body: `<div class="lk-bignum" style="margin:10px auto;min-width:220px"><span>PEA</span><b>8.055</b><div class="lk-trio" style="grid-template-columns:1fr 1fr;margin-top:6px"><div><span>Homens</span><b style="font-size:18px">51,49%</b></div><div><span>Mulheres</span><b style="font-size:18px">48,51%</b></div></div></div>
      <p class="lk-subtitle" style="text-align:center">População desempregada</p>
      <div class="lk-bignum" style="margin:6px auto;min-width:220px"><span>Desocupados</span><b>2.801</b><div class="lk-trio" style="grid-template-columns:1fr 1fr;margin-top:6px"><div><span>Homens</span><b style="font-size:18px">38,00%</b></div><div><span>Mulheres</span><b style="font-size:18px">62,00%</b></div></div></div>` })}
    ${card({ title: "Renda total por <b>classe social (mensal)</b>", body: `<div class="lk-letters"><span><b>A</b>12,8 mi</span><span><b>B</b>11,3 mi</span><span><b>C</b>2,44 mi</span><span><b>D</b>2,6 mi</span><span><b>E</b>349,5 mi</span></div><div id="p-renda"></div>` })}
    ${card({ title: "Renda total por classe social do setor - <b>Homens X Mulheres</b>", body: `${leg}<div id="g-renda"></div>` })}
  </div>`);
LK.map("#map", { seed: 89, height: 380, slider: true, sectors: { n: 10, colors: ["--c8"], opacity: 0.38 }, parks: 4 });
LK.pie("#p-pop", { donut: true, items: [{ label: "Classe A", value: 13.2, color: "#c89be0" }, { label: "Classe B", value: 30.8, color: "#cfdc5a", ink: "#3d4200" }, { label: "Classe C", value: 14.6, color: "#e0689a" }, { label: "Classe D", value: 32.1, color: "#b0284f" }, { label: "Classe E", value: 9.3, color: "#6fcde0", ink: "#0e4450" }] });
LK.pie("#p-renda", { donut: true, items: [{ label: "Classe A", value: 43.4, color: "--c4" }, { label: "Classe B", value: 38.4, color: "#4eb3c8" }, { label: "Classe C", value: 8.3, color: "--c6" }, { label: "Classe D", value: 8.8, color: "--c3" }, { label: "Classe E", value: 1.1, color: "#f2c94c", est: true }] });
const cls = ["Classe A", "Classe B", "Classe C", "Classe D", "Classe E"];
LK.grouped("#g-pop", { categories: cls, height: 300, series: [{ name: "Homens", color: "--c4", values: [779, 1392, 515, 1240, 269] }, { name: "Mulheres", color: "--c6", values: [280, 1087, 656, 1346, 491] }], tickFmt: (v) => (v >= 1000 ? fmt.dec(v / 1000, 1).replace(",0", "") + " mil" : fmt.int(v)) });
LK.grouped("#g-renda", { categories: cls, height: 340, rotate: true, labelFmt: "int", series: [{ name: "Homens", color: "--c4", values: [9735563, 6619559, 1082957, 1258749, 123090] }, { name: "Mulheres", color: "--c6", values: [3085035, 4705166, 1354858, 1325067, 226456] }], tickFmt: (v) => fmt.dec(v / 1e6, 1).replace(",0", "") + " mi" });
LK.icons();
</script>
</body>
</html>
