<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socioeconômico · 2022 · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/bi.css">
</head>
<body>
<main class="bi-main"></main>
<script src="assets/icons.js"></script>
<script src="assets/bi.js"></script>
<script src="assets/mercado.js"></script>
<script>
const { fmt } = LBI;
document.querySelector("main").innerHTML = `
  <div class="bi-toolbar"><div data-subnav></div></div>
  <div class="bi-toolbar">${LBI.rangeHtml({ label: "Distância do imóvel", min: 0, max: 1000, lo: 0, hi: 1000, unit: " m" })}</div>
  <h2 class="section-title"><i data-lucide="wallet"></i>Renda média e distribuição de renda<small>Censo 2022 · setores censitários</small></h2>
  <div class="grid grid--2">
    <section class="card">
      <div class="card__head"><div class="card__titles"><h2 class="card__title">Renda média</h2><p class="card__subtitle">Renda domiciliar média mensal por setor censitário</p></div></div>
      <div id="map1"></div>
      <div class="grid grid--2" style="gap:12px">
        <div class="kpi"><span class="kpi__label"><i data-lucide="map-pin"></i>Setor do imóvel</span><span class="kpi__value">R$ 10.285,45</span><span class="kpi__foot">Predomínio de classe: não identificado</span></div>
        <div class="kpi"><span class="kpi__label"><i data-lucide="circle-dashed"></i>Setores do entorno</span><span class="kpi__value">R$ 9.463,53</span><span class="kpi__foot">Média no raio de 1 km</span></div>
      </div>
      <div><div class="eyebrow" style="margin-bottom:8px">Classes de renda no entorno</div><div id="classes"></div></div>
      <div class="note"><i data-lucide="info"></i><p><b>Popular, Média e Alta</b> são a distribuição percentual das faixas de renda (baixa, média e alta) dos moradores na região expandida e mostram o perfil socioeconômico predominante no entorno.</p></div>
    </section>
    <section class="card">
      <div class="card__head"><div class="card__titles"><h2 class="card__title">Variação da renda</h2><p class="card__subtitle">Desigualdade de renda entre os moradores de cada setor</p></div></div>
      <div id="map2"></div>
      <div class="grid grid--2" style="gap:12px">
        <div class="kpi"><span class="kpi__label"><i data-lucide="map-pin"></i>Setor do imóvel</span><span class="kpi__value">Diversificada</span><span class="kpi__foot">Distribuição de renda no setor</span></div>
        <div class="kpi"><span class="kpi__label"><i data-lucide="circle-dashed"></i>Setores do entorno</span><span class="kpi__value">Desigual</span><span class="kpi__foot">Classificação mais frequente (39,5%)</span></div>
      </div>
      <div><div class="eyebrow" style="margin-bottom:8px">Distribuição de renda no entorno</div><div id="distrib"></div></div>
      <div class="note"><i data-lucide="info"></i><p><b>Homogênea:</b> a maioria dos moradores tem renda parecida. <b>Diversificada:</b> mistura equilibrada de faixas de renda, sem grupo dominante. <b>Desigual:</b> grande disparidade, com a renda concentrada em um grupo pequeno.</p></div>
    </section>
  </div>`;
LBI.shell({ section: "socioeconomico", sub: "2022" });
const ords = ["--ord-1", "--ord-2", "--ord-3", "--ord-4", "--ord-5"];
LBI.map("#map1", { seed: 79, height: 320, controls: false, water: "bay", sectors: { n: 16, spread: 150, colors: ords, opacity: 0.6 },
  legend: `<span class="eyebrow">Renda média</span><div class="map-gradient"><span>R$ 1.918</span><i style="background:linear-gradient(90deg,var(--ord-1),var(--ord-3),var(--ord-5))"></i><span>R$ 14.986</span></div>` });
LBI.map("#map2", { seed: 83, height: 320, controls: false, water: "bay", heat: [[500, 280, 150], [560, 360, 110], [470, 200, 90], [600, 470, 80]],
  legend: `<span class="eyebrow">Variação de renda</span><div class="map-gradient"><span>Baixa</span><i style="background:linear-gradient(90deg,#fff0,var(--color-brand-primary-light),var(--primary))"></i><span>Alta</span></div>` });
LBI.stackbar("#classes", { label: "Classes de renda", items: [{ label: "Popular", value: 4.8, color: "--ord-1", ink: "dark" }, { label: "Média", value: 28.6, color: "--ord-3" }, { label: "Alta", value: 66.7, color: "--ord-5" }], fmt: (v) => fmt.pct(v) });
LBI.stackbar("#distrib", { label: "Distribuição de renda", items: [{ label: "Homogênea", value: 23.7, color: "--cat-1" }, { label: "Diversificada", value: 36.8, color: "--cat-2", ink: "dark" }, { label: "Desigual", value: 39.5, color: "--cat-3", ink: "dark" }], fmt: (v) => fmt.pct(v) });
LBI.icons();
</script>
</body>
</html>
