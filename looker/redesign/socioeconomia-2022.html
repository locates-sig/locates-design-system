<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socioeconômico · Socioeconomia 2022 · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const { card } = LK;
const kcard = (ic, t1, t2, body) => `<div class="lk-kpi-card"><div class="lk-kpi-card__head"><span>${t1}<br><b>${t2}</b></span><i data-lucide="${ic}"></i></div>${body}</div>`;
const lines = (rows) => `<dl class="lk-stats" style="grid-template-columns:1fr auto">${rows.map(([k, v]) => `<dt style="color:var(--lk-up);font-weight:500">${k}</dt><dd style="color:var(--lk-up)">${v}</dd>`).join("")}</dl>`;
LK.page({ section: "socioeconomico", sub: "2022" }, `
  <div class="lk-bar"><span style="font-size:14px;font-weight:700">Distância do imóvel:</span>${LK.range("Distância", "0", "1.000")}</div>
  <div class="lk-section-title">Renda média e distribuição de renda</div>
  <div class="lk-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    ${card({ title: "Mapa dos setores censitários - <b>Renda média</b>", body: `<div class="lk-grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
        <div class="lk-card" style="box-shadow:none"><div id="map1"></div><div class="lk-gradient"><b>Renda Média</b><span>1.917,66</span><i style="background:linear-gradient(90deg,#e7f0ff,#5b8def)"></i><span>14.986,02</span></div></div>
        <div class="lk-col">
          ${kcard("circle-dollar-sign", "Renda média", "no setor do imóvel", `<span class="lk-kpi-card__big">R$ 10.285,45</span><span style="font-size:12px;color:var(--lk-ink-2)">Renda média no setor</span><span style="font-size:12.5px;margin-top:6px">Predomínio de classe</span><span style="color:var(--lk-up)">-</span>`)}
          ${kcard("circle-dollar-sign", "Renda média", "nos setores do entorno", `<span class="lk-kpi-card__big">R$ 9.463,53</span><span style="font-size:12px;color:var(--lk-ink-2)">Renda média no setor</span>${lines([["Popular", "4,8%"], ["Média", "28,6%"], ["Alta", "66,7%"]])}`)}
        </div></div>
      <div class="lk-note-box"><i data-lucide="info"></i><span>As classificações "Popular", "Média" e "Alta" representam a distribuição percentual das faixas de renda (baixa, média e alta) dos moradores nessa região expandida, indicando o perfil socioeconômico predominante no entorno.</span></div>` })}
    ${card({ title: "Mapa dos setores censitários - <b>Variação da renda</b>", body: `<div class="lk-grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
        <div class="lk-card" style="box-shadow:none"><div id="map2"></div><div class="lk-gradient" style="flex-wrap:wrap"><span>0</span><i style="background:linear-gradient(90deg,#fff3c4,#f29a3a,#9b2d1f)"></i><span>123</span><b style="margin-left:8px">Interpretação</b><span style="color:#c2512a">●</span> Alta <span style="color:#e07a2f">●</span> Média <span style="color:#f0a340">●</span> Baixa Variação de Renda</div></div>
        <div class="lk-col">
          ${kcard("chart-pie", "Distribuição da renda", "no setor do imóvel", `<span class="lk-kpi-card__big lk-kpi-card__big--accent">Diversificada</span><span style="font-size:12px;color:var(--lk-ink-2)">distribuição de renda no setor</span>`)}
          ${kcard("chart-pie", "Distribuição da renda", "nos setores do entorno", lines([["Homogênea", "23,7%"], ["Diversificada", "36,8%"], ["Desigual", "39,5%"]]))}
        </div></div>
      <div class="lk-note-box"><i data-lucide="info"></i><span>"Homogênea" indica que a maioria dos moradores possui renda similar. "Diversificada" aponta para uma mistura equilibrada de diferentes faixas de renda, sem um grupo dominante. "Desigual" revela uma grande disparidade, com uma forte concentração de renda em um pequeno grupo.</span></div>` })}
  </div>`);
LK.map("#map1", { seed: 79, height: 340, sectors: { n: 12, colors: ["#5b8def"], opacity: 0.35 }, water: true, parks: 4 });
LK.map("#map2", { seed: 83, height: 340, sectors: { n: 7, colors: ["#e07a2f", "#c2512a", "#f0a340"], opacity: 0.55 }, water: true, parks: 4 });
LK.icons();
</script>
</body>
</html>
