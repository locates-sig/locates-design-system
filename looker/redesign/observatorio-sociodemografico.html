<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatório · Sociodemográfico · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const { card } = LK;
const d = (v) => LK.delta(v, 1);
const sc = (l, v, dv) => `<div class="lk-kpi-card"><span style="font-size:12px;color:var(--lk-ink-2)">${l}</span><span class="lk-kpi-card__big">${v}</span>${d(dv)}</div>`;
const cmp = (t, a, b, v) => `<div class="lk-cmp"><div class="lk-cmp__title">${t}</div><div class="lk-cmp__row"><span>2010</span><span>${a}</span></div><div class="lk-cmp__row"><span>2022</span><span>${b}</span></div><div class="lk-cmp__row lk-cmp__row--var"><span>Variação</span>${d(v)}</div></div>`;
const tbl = (id, t) => card({ title: t, id, flush: true });
LK.page({ report: "obs", section: "sociodemografico" }, `
  <div class="lk-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">Mapa dos <b>bairros</b></h2></div><div id="map"></div></section>
    <div class="lk-col">
      <div class="lk-bar">${LK.dd("Bairro", 0, true)}</div>
      ${card({ title: "Dados <b>gerais</b>", body: `<div class="lk-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${sc("População", "534.604", 28.2)}${sc("Domicílios", "221.116", 50.0)}${sc("Renda Média", "R$ 5.935", 110.7)}</div>` })}
      ${card({ title: "Comparativo detalhado - <b>População por domicílio</b>", body: `<div class="lk-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${cmp("1 morador por domicílio", "25.763", "57.869", 124.6)}${cmp("2 moradores por domicílio", "41.597", "73.919", 77.7)}${cmp("3 moradores por domicílio", "36.986", "48.389", 30.8)}</div>
        <h3 class="lk-card__title" style="margin-top:6px">Comparativo detalhado - <b style="color:var(--lk-purple)">Grupos etários</b></h3>
        <div class="lk-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">${cmp("Crianças", "74.677", "82.785", 10.9)}${cmp("Jovens", "117.278", "116.339", -0.8)}${cmp("Adultos", "179.115", "243.873", 36.2)}${cmp("Idosos", "48.183", "91.463", 89.8)}</div>` })}
    </div>
  </div>
  <div class="lk-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    ${tbl("t-pop", "Crescimento populacional <b>dos bairros</b>")}
    ${tbl("t-dom", "Crescimento de domicílios <b>dos bairros</b>")}
    ${tbl("t-renda", "Crescimento da renda média <b>dos bairros</b>")}
  </div>`);
LK.map("#map", { seed: 157, height: 560, kind: "city", points: { n: 56, r: 7, colors: ["--c2"], alpha: 0.8 } });
const cols = [{ label: "Bairro" }, { label: "2010", align: "r" }, { label: "2022", align: "r" }, { label: "Variação %", heat: "purple", sort: "desc", fmt: (v) => LK.fmt.dec(v, 2).replace(/,?0+$/, "") }];
LK.table("#t-pop", { index: true, columns: cols, pager: "1 - 10 / 56", rows: [["Moçambique", "1.527", "4.164", 172.69], ["Rio Vermelho", "10.606", "26.548", 150.31], ["Ingleses", "26.055", "46.292", 77.67], ["Vargem Pequena", "1.214", "2.143", 76.52], ["Campeche", "16.904", "29.728", 75.86], ["Alto Ribeirão", "4.428", "7.395", 67.01], ["Vargem do Bom Jesus", "5.612", "9.168", 63.36], ["Vargem Grande", "3.852", "6.143", 59.48], ["Ratones", "2.436", "3.680", 51.07], ["Itacorubi", "15.631", "23.591", 50.92]] });
LK.table("#t-dom", { index: true, columns: cols, pager: "1 - 10 / 56", rows: [["Moçambique", "519", "1.547", 198.07], ["Rio Vermelho", "4.055", "9.911", 144.41], ["Vargem Pequena", "400", "831", 107.75], ["Campeche", "6.067", "12.510", 106.2], ["Alto Ribeirão", "1.403", "2.883", 105.49], ["Ingleses", "8.927", "18.331", 105.34], ["Vargem Grande", "1.235", "2.272", 83.97], ["Vargem do Bom Jesus", "1.813", "3.304", 82.24], ["Praia Brava", "77", "140", 81.82], ["Pantanal", "2.139", "3.767", 76.11]] });
LK.table("#t-renda", { index: true, columns: cols, pager: "1 - 10 / 56", rows: [["Cachoeira do Bom Jesus", "1.799", "5.468,3", 203.96], ["Morro das Pedras", "2.380", "7.060,34", 196.65], ["Ribeirão da Ilha", "1.387,56", "3.751,03", 170.33], ["Ratones", "1.461", "3.883,87", 165.84], ["Costa da Lagoa", "828,5", "2.155,67", 160.19], ["Rio Vermelho", "1.205,5", "3.115,82", 158.47], ["Carianos", "2.211,09", "5.685,85", 157.15], ["Ponta das Canas", "1.540,71", "3.885,41", 152.18], ["Santo Antônio de Lisboa", "3.340,8", "8.331,53", 149.39], ["Barra da Lagoa", "1.838,45", "4.570,47", 148.6]] });
LK.icons();
</script>
</body>
</html>
