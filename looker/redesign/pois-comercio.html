<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pontos de interesse · Comércio e serviços · Locates BI</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="assets/lk.css">
</head>
<body>
<main></main>
<script src="assets/icons.js"></script>
<script src="assets/lk.js"></script>
<script>
const icl = (items) => `<ul class="lk-iconlist">${items.map(([ic, l, v]) => `<li><span class="ic"><i data-lucide="${ic}"></i></span><span class="nm">${l}</span><span class="val">${v}</span></li>`).join("")}</ul>`;
const mapCard = (title, legend) => `<section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">${title}</h2>${LK.range("Distância", "0", "1.000")}</div><div id="map"></div><div class="lk-map-legend"><b>Categoria:</b>${legend}</div></section>`;
LK.page({ section: "pois", sub: "comercio" }, `
  <div class="lk-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    ${mapCard("Mapa dos pontos de <b>interesse (POIs)</b>", '<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c6);margin-right:5px"></i>Igrejas</span>')}
    <section class="lk-card"><div class="lk-card__body"><div class="lk-grid" style="grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)">
      <div><h2 class="lk-card__title" style="margin-bottom:10px">Pontos de Interesse - <b>POIs</b></h2>${icl([["croissant", "Padarias", 0], ["banknote", "Bancos", 0], ["shopping-cart", "Mercados", 0], ["bed", "Hostels", 0], ["hotel", "Hotels", 0], ["utensils", "Restaurantes", 0], ["sandwich", "Fast Foods", 0], ["cross", "Farmácias", 0], ["fuel", "Posto de Gasolina", 0], ["church", "Igrejas", 3], ["beer", "Bar", 0]])}</div>
      <div class="lk-col">
        <section class="lk-card"><div class="lk-card__head"><h2 class="lk-card__title">POIs por <b>categoria</b></h2></div><div class="lk-card__body" id="p-cat"></div></section>
        <section class="lk-card" style="flex:1"><div class="lk-card__head"><h2 class="lk-card__title">Lista de informações <b>dos POIs</b></h2></div><div id="t-poi"></div></section>
      </div></div></div></section>
  </div>`);
LK.map("#map", { seed: 97, height: 440, points: { n: 3, spread: 150, r: 8, colors: ["--c6"] }, parks: 4 });
LK.pie("#p-cat", { donut: true, items: [{ label: "Igrejas", value: 100, color: "--c6" }] });
LK.table("#t-poi", { columns: [{ label: "Categoria", sort: "desc" }, { label: "Nome" }, { label: "Distância (m)", align: "r" }], rows: [["Igrejas", "Sara Nossa Terra - Ilha", "710.4"], ["Igrejas", "Igreja Deus é Amor", "869.65"], ["Igrejas", "Bola de Neve Church", "238.84"]], pager: "1 - 3 / 3" });
LK.icons();
</script>
</body>
</html>
